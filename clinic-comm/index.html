<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E6E6B">
<title>泌尿科門診溝通板</title>
<style>
  :root { --line:#E6DFD2; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#F7F4EE; color:#1C1917; font-family:"PingFang TC","Noto Sans TC",sans-serif; }
  button, input { font-family:inherit; }
  button { cursor:pointer; }
  .split { height:100dvh; display:flex; flex-direction:column; }
  .half { min-height:0; display:flex; flex-direction:column; }
  .doc { flex:0 0 42%; background:#F3FAF9; }
  .pat { flex:1; background:#FFF7F7; border-top:3px solid #E7E0D4; }
  .bar { display:flex; align-items:center; justify-content:space-between; padding:calc(8px + var(--safe-t)) 12px 6px; }
  .pat .bar { padding-top:8px; }
  .bar b { font-size:22px; }
  .mic { border:0; border-radius:14px; background:#6D28D9; color:#fff; font-size:22px; font-weight:800; min-height:52px; padding:0 18px; }
  .mic.on { background:#BE123C; }
  .said { margin:0 12px 8px; border-radius:18px; min-height:108px; padding:16px; display:flex; align-items:center; color:#fff; font-size:34px; font-weight:800; line-height:1.25; }
  .doc .said { background:#123E3C; flex:1; }
  .pat .said { background:#7F1D1D; min-height:88px; }
  .hint { margin:0 14px 8px; color:#57534E; font-size:16px; }
  .list { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:1fr 1fr; gap:8px; align-content:start; padding:0 12px calc(10px + var(--safe-b)); }
  .phrase { text-align:left; border:1px solid var(--line); background:#fff; border-radius:14px; padding:16px 12px; font-size:22px; font-weight:800; }
  .sheet { position:fixed; inset:0; background:rgba(28,25,23,.4); display:none; align-items:flex-end; z-index:30; }
  .sheet.show { display:flex; }
  .box { width:min(560px,100%); margin:0 auto; background:#F7F4EE; border-radius:20px 20px 0 0; padding:16px 14px calc(16px + var(--safe-b)); max-height:70vh; overflow:auto; }
  .box h3 { margin:0 0 10px; font-size:22px; }
  .choices { display:flex; flex-direction:column; gap:8px; }
  .choices button, .ghost { border:1px solid var(--line); background:#fff; border-radius:14px; padding:14px; font-size:22px; font-weight:800; text-align:left; }
  .ghost { width:100%; margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="split">
  <section class="half doc">
    <div class="bar"><b>醫師</b><button class="mic" id="micDoc">按住說</button></div>
    <div class="said" id="docNow">請按右上角，說一句</div>
    <p class="hint" id="docHint">說完會變成上面的字。再按一次可停止。</p>
  </section>
  <section class="half pat">
    <div class="bar"><b>患者</b></div>
    <div class="said" id="patNow">請點下面回答</div>
    <div class="list" id="patMain"></div>
  </section>
</div>
<div class="sheet" id="sheet">
  <div class="box">
    <h3 id="sheetTitle">請選擇</h3>
    <div class="choices" id="choices"></div>
    <button class="ghost" id="sheetClose">先不選</button>
  </div>
</div>
<script>
const PAT = [
  ["懂了"],["不懂，請再說"],["是"],["不是"],["不確定"],
  ["哪裡不舒服", ["左邊腰","右邊腰","下腹","膀胱","會陰","尿道"]],
  ["多久了", ["今天才開始","昨天","好幾天","好幾個星期","好幾個月","一直都有"]],
  ["有多痛", ["不痛","有一點痛","很痛","痛到睡不著","0 分","2 分","4 分","6 分","8 分","10 分"]],
  ["尿尿的狀況", ["尿尿有血","尿尿會痛","很常想尿","很急","尿不出來","尿很細","會漏尿","晚上要起來尿"]],
  ["夜尿幾次", ["0 次","1 次","2 次","3 次","4 次以上"]],
  ["其他", ["請慢一點","請寫大一點","我有問題","我想上廁所","請叫家屬","要手語翻譯","我同意","我不同意","先不要決定"]]
];
let pending = null;
const $ = (id) => document.getElementById(id);
function showPat(text) { $("patNow").textContent = text; }
function openChoices(title, items, onPick) {
  pending = onPick;
  $("sheetTitle").textContent = title;
  $("choices").innerHTML = items.map((t,i) => `<button data-i="${i}">${t}</button>`).join("");
  $("sheet").classList.add("show");
}
$("patMain").innerHTML = PAT.map((item,i) => `<button class="phrase" data-i="${i}">${item[0]}</button>`).join("");
$("patMain").onclick = (e) => {
  const b = e.target.closest("[data-i]"); if (!b) return;
  const item = PAT[b.dataset.i];
  showPat(item[0]);
  if (item[1]) openChoices(item[0], item[1], (choice) => showPat(item[0] + "：" + choice));
};
$("choices").onclick = (e) => {
  const b = e.target.closest("[data-i]"); if (!b || !pending) return;
  const fn = pending; pending = null; $("sheet").classList.remove("show"); fn(b.textContent);
};
$("sheetClose").onclick = () => { pending = null; $("sheet").classList.remove("show"); };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listenSession = 0, listening = false;
function stopVoice() {
  listenSession++; listening = false;
  $("micDoc").classList.remove("on");
  $("micDoc").textContent = "按住說";
  if (!rec) return;
  const old = rec; rec = null;
  old.onresult = old.onerror = old.onend = null;
  try { old.abort(); } catch (e) {}
}
function startVoice() {
  if (!SR) { $("docHint").textContent = "這支手機不能語音，請改用 Safari"; return; }
  if (listening) { stopVoice(); $("docHint").textContent = "已停止"; return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  stopVoice();
  const session = listenSession;
  const mine = new SR();
  rec = mine; mine.lang = "zh-TW"; mine.interimResults = true; mine.continuous = false;
  listening = true;
  $("micDoc").classList.add("on");
  $("micDoc").textContent = "停止";
  $("docNow").textContent = "請說話";
  $("docHint").textContent = "正在聽…";
  const timer = setTimeout(() => { if (session === listenSession) stopVoice(); }, 8000);
  mine.onresult = (e) => {
    if (session !== listenSession) return;
    let text = "";
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    text = text.trim();
    if (text) $("docNow").textContent = text;
  };
  mine.onerror = (e) => {
    if (session !== listenSession) return;
    clearTimeout(timer); stopVoice();
    $("docHint").textContent = e.error === "not-allowed" ? "請允許麥克風" : "沒聽清楚，請再按一次";
  };
  mine.onend = () => {
    if (session !== listenSession) return;
    clearTimeout(timer); listening = false;
    $("micDoc").classList.remove("on");
    $("micDoc").textContent = "按住說";
    rec = null;
    $("docHint").textContent = "說完了。要改再說一次。";
  };
  try { mine.start(); } catch (e) { clearTimeout(timer); stopVoice(); $("docHint").textContent = "麥克風無法啟動，請再按一次"; }
}
$("micDoc").onclick = startVoice;
</script>
</body>
</html>
